# Stage 2 (canonical -> internal model) for NSDL security data.
# Consumes validated canonical values only; performs no parsing or normalization.
#
# This file holds only what the service reads from it; an unknown key fails startup.
# Fixed in code and specified in the LLD: a scalar changes only when its value differs, no-value
# inputs erase nothing, and competing values in one request are resolved by S3 LastModified then
# object key (section 13.5); collections are append-only and deduplicated on all mapped fields
# (section 13.6); an Unsecured status clears coverage and suppresses assets (section 15.2).
#
# v2 (decision 0007): both NSDL cash-flow lists fill security_cash_flows, told apart by the
# sourceCategory constant. A payment identical in both lists is stored once.
# v3 (decision 0009) only follows nsdl-security-json-v3; the mapping is unchanged.
# v4 (decision 0010) maps total_issue_size and seniority_repayment to the security.
id: nsdl-security-mapping
version: v4
sourceContract: nsdl-security-json-v4

security:
  target: securities_data.securities
  fields:
    issuer_name: issuerName
    issuer_ownership_type: issuerOwnershipType
    instrument_type: instrumentType
    allotment_date: allotmentDate
    redemption_date: redemptionDate
    original_face_value: originalFaceValue
    total_issue_size: totalIssueSize       # crore rupees, as NSDL gives it
    seniority_repayment: seniorityRepayment
    collateral_status: collateralStatus
    asset_coverage_basis: assetCoverageBasis
    asset_coverage: assetCoverage          # { value, unit: PERCENT }
    coupon_rate: couponRate                # { value, unit: PERCENT }
    coupon_type: couponType
    listing_status: listingStatus

collections:
  cash_flows:
    target: securities_data.security_cash_flows
    constants: { sourceCategory: SCHEDULE }
    fields: &cashFlowMap { event_type: eventType, record_date: recordDate, due_date: dueDate, amount_payable: amountPayable, payment_date: paymentDate, new_face_value: newFaceValue }
  interest_cash_flows:
    target: securities_data.security_cash_flows
    constants: { sourceCategory: INTEREST }
    fields: *cashFlowMap
  listings:
    target: securities_data.security_listings
    fields: { exchange_name: exchangeName, listing_date: listingDate }
  current_ratings:
    target: securities_data.security_ratings
    constants: { sourceCategory: CURRENT }
    fields: &ratingMap
      rating_agency_name: ratingAgencyName
      rating: rating
      outlook: outlook
      rating_action: ratingAction
      rating_date: ratingDate
      rating_change_date: ratingChangeDate
      verification_date: verificationDate
  earlier_ratings:
    target: securities_data.security_ratings
    constants: { sourceCategory: EARLIER }
    fields: *ratingMap
  collateral_assets:
    target: securities_data.security_collateral_assets
    fields: { asset_type: assetType, collateral_description: collateralDescription, remarks: remarks }
