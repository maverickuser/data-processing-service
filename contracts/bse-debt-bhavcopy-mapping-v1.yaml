# Stage 2 (canonical -> internal model) for BSE debt bhavcopy rows.
# Consumes validated canonical rows only; performs no parsing or normalization.
id: bse-debt-bhavcopy-mapping
version: v1
sourceContract: bse-debt-bhavcopy-csv-v1

target: securities_data.security_daily_market_summaries
eligibleDisposition: ACCEPTED
context: { tradeDate: tradeDate, exchangeName: exchangeName }
fields:
  security_code: securityCode
  open_price: openPrice
  high_price: highPrice
  low_price: lowPrice
  close_price: closePrice
  traded_volume: tradedVolume
  number_of_trades: numberOfTrades
  turnover: turnover
  face_value: faceValue
  isin: isin
persistence:
  key: [isin, tradeDate, exchangeName]
  action: upsert
  onMatch: replaceAllMappedValues
  optionalNulls: overwriteExistingValues
  missingIsins: leaveExistingUnchanged
onNewIsin: { createSecurity: isinOnly, emitEvent: com.bondplatform.data.pull.requested.v1 }
lineage: { canonicalRowReference: required }
