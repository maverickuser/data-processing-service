# Stage 2 (canonical -> internal model) for BSE debt bhavcopy rows.
# Consumes validated canonical rows only; performs no parsing or normalization.
#
# This file holds only what the service reads from it; an unknown key fails startup.
# Fixed in code and specified in the LLD: only accepted rows are mapped, trade date and exchange
# come from the manifest, rows are upserted on (isin, tradeDate, exchangeName) with nulls
# overwriting (section 7), and a trade for an unknown ISIN creates the security and emits one
# security-details event (section 14).
id: bse-debt-bhavcopy-mapping
version: v1
sourceContract: bse-debt-bhavcopy-csv-v1

target: securities_data.security_daily_market_summaries
fields:
  security_code: securityCode
  open_price: openPrice
  high_price: highPrice
  low_price: lowPrice
  close_price: closePrice
  traded_volume: tradedVolume
  number_of_trades: numberOfTrades
  turnover: turnover
  face_value: faceValue
  isin: isin
