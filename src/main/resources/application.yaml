spring:
  application:
    name: data-processing-service
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/data_processing}
    username: ${DATABASE_USERNAME:data_processing}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # One connection per Lambda execution environment (LLD section 23.5), opened on first use.
      maximum-pool-size: 1
      minimum-idle: 0
      initialization-fail-timeout: -1
      # Give up on getting a connection well inside API Gateway's 29-second limit.
      connection-timeout: 10000
      data-source-properties:
        # PostgreSQL driver timeouts, in seconds: opening the connection, and waiting on a reply.
        connectTimeout: 10
        socketTimeout: 60
        # Do not add reWriteBatchedInserts: repositories rely on a row count per batched insert.
  servlet:
    encoding:
      # RequestCharsetFilter decides the request character set: UTF-8, or 415. Spring's own filter
      # would ask the container to resolve the declared name first, and a malformed one fails there.
      enabled: false
  flyway:
    # Migrations are run by the migration function during deployment, never at application start.
    enabled: false
    # Migrations use their own connections rather than the application's one-connection pool:
    # Flyway holds two at once (one for its history-table lock, one to run the migration).
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    default-schema: data_processing
    schemas: data_processing,securities_data
    locations: classpath:db/migration

logging:
  structured:
    format:
      # One JSON object per line, so CloudWatch Logs Insights can query fields; MDC entries such as
      # jobId and attemptNumber become top-level fields (LLD section 23.8).
      console: logstash

data-processing:
  sources:
    # The fetch service's artifact bucket; no other bucket is read (LLD section 19).
    region: ${AWS_REGION:ap-south-1}
    allowed-buckets: ${SOURCE_BUCKETS:}
  events:
    # The CloudEvent source of every event this service produces, including the environment
    # (LLD section 14.2), for example urn:bond-platform:structured-file-processing:prod.
    source: ${EVENT_SOURCE:}
  canonical:
    # The service's own bucket for each run's canonical JSON Lines file (LLD section 17.5).
    bucket: ${CANONICAL_BUCKET:}
  queues:
    # Lambda sets AWS_REGION. The queue URLs come from Terraform; the security-details queue is
    # owned elsewhere (LLD section 14.2). A URL ending in .fifo is sent to as a FIFO queue.
    region: ${AWS_REGION:ap-south-1}
    file-processing-url: ${FILE_PROCESSING_QUEUE_URL:}
    security-details-url: ${SECURITY_DETAILS_QUEUE_URL:}
  api:
    # The public origin of the API; links in responses (Location, statusUrl) are built from it.
    public-base-url: ${PUBLIC_BASE_URL:https://processing.kagent.app}
  # One entry per dataset: the stage-1 and stage-2 contract files, without the .yaml extension.
  contracts:
    - source: bse-debt-bhavcopy-csv-v1
      mapping: bse-debt-bhavcopy-mapping-v1
    - source: nsdl-security-json-v1
      mapping: nsdl-security-mapping-v1
