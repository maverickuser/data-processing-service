# Test-only settings, layered over src/main/resources/application.yaml. Nothing listens at these
# queue URLs: a send fails, and the event stays pending, as it would during an SQS outage.
data-processing:
  api:
    # Tests serve every route from one application.
    read-routes: true
    submission-routes: true
    # The one role tests may sign requests in as; any other caller is refused.
    read-callers:
      role-arns: arn:aws:iam::000000000000:role/test-reader
  sources:
    region: ap-south-1
    endpoint: http://127.0.0.1:1
    allowed-buckets: data-fetch-service-artifacts
  events:
    source: urn:bond-platform:structured-file-processing:test
  canonical:
    bucket: data-processing-service-canonical
  queues:
    region: ap-south-1
    endpoint: http://127.0.0.1:1
    file-processing-url: http://127.0.0.1:1/000000000000/file-processing.fifo
    security-details-url: http://127.0.0.1:1/000000000000/security-details
