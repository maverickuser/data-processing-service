name: ci

# Continuous integration only: nothing here deploys or uses AWS credentials.
# Runs on every pull request whatever its base branch, so stacked PRs are checked too.
on:
  pull_request:
    # `edited` reruns the checks when a stacked PR is retargeted after its parent merges.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the run for the commit it replaces. An `edited` event that only changes the
# title or description gets its own group: it can arrive after a push and still name the older commit,
# and in the shared group it would cancel the newer commit's run. A base change stays in the shared group.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edited' || '' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin

# Stages run in this order; a later stage starts only when the stages it needs have passed.
#
#   compile ─┬─ static-analysis ───────────────┐
#            ├─ unit-test ── integration-test ─┼─ package ─┐
#            └─ contracts-and-docs ────────────┴───────────┼─ ci-passed
#   infrastructure ────────────────────────────────────────┘
jobs:
  compile:
    name: 1 · compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compile main and test sources (Error Prone and NullAway)
        run: make compile

  static-analysis:
    name: 2 · static analysis
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Formatting, Checkstyle, and architecture rules
        run: make lint
      - name: Upload architecture test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-reports
          if-no-files-found: ignore
          path: target/surefire-reports/

  unit-test:
    name: 3 · unit tests and coverage
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests and the strict 95% coverage gate
        run: make coverage-check
      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/site/jacoco/

  integration-test:
    name: 4 · integration tests
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Integration tests
        env:
          # Makes DockerAvailabilityIT fail the stage if database tests would be skipped.
          CI: 'true'
        run: make test-integration
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          if-no-files-found: ignore
          path: target/failsafe-reports/

  contracts-and-docs:
    name: 5 · contracts and documentation
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Processing contracts, OpenAPI documents, and documentation links
        run: make check-contracts check-docs

  package:
    name: 6 · package
    needs: [static-analysis, integration-test, contracts-and-docs]
    uses: ./.github/workflows/package.yml

  infrastructure:
    name: 7 · infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_VERSION: 1.16.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Terraform after checking its pinned checksum
        env:
          # From HashiCorp's SHA256SUMS for 1.16.4; change it together with TERRAFORM_VERSION.
          TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
        run: |
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSLo "$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "$TERRAFORM_SHA256  $zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && unzip -oq "$zip" terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Terraform format, validate, and mocked tests without AWS credentials
        run: make check-infra

  # The single check to require on `main`: passes only when every stage passed.
  ci-passed:
    name: ci passed
    if: always()
    needs: [compile, static-analysis, unit-test, integration-test, contracts-and-docs, package, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every stage succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Stage results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
