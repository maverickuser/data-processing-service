name: Deploy
# Only trusted main commits can apply infrastructure. A release reruns every CI gate on that SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-processing-service-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STATE_BUCKET: data-processing-service-terraform-state

jobs:
  checks:
    name: Exact-commit checks and package
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preflight:
    name: Deployment input preflight
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
    steps:
      - name: Require production inputs
        run: |
          set -euo pipefail
          if [ -z "$AWS_ROLE_TO_ASSUME" ] || [ -z "$HOSTED_ZONE_ID" ]; then
            echo '::error::AWS_ROLE_TO_ASSUME and HOSTED_ZONE_ID must be configured'
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the public hosted zone and deployment account
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          aws route53 get-hosted-zone --id "$HOSTED_ZONE_ID" > "$RUNNER_TEMP/zone.json"
          jq -e '.HostedZone.Name == "kagent.app." and .HostedZone.Config.PrivateZone == false' "$RUNNER_TEMP/zone.json" >/dev/null
          for bucket in "$STATE_BUCKET" data-processing-service-artifacts data-processing-service-canonical; do
            if probe="$(aws s3api head-bucket --bucket "$bucket" --expected-bucket-owner "$account" 2>&1)"; then
              echo "$bucket belongs to the deployment account."
            elif grep -q '(404)' <<<"$probe"; then
              echo "$bucket is not created yet."
            else
              echo "::error::$bucket is inaccessible or owned by another account."
              echo "$probe"
              exit 1
            fi
          done

  network:
    name: Shared network
    needs: preflight
    uses: maverickuser/cloud-platform-network/.github/workflows/apply.yml@v1
    with:
      network_ref: v1
      aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      apply: true
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

  deploy:
    name: Apply processing service and promote versions
    needs: [checks, preflight, network]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: prod
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
      TF_VAR_deployment_commit: ${{ github.sha }}
      # Empty when the network workflow does not report them; the endpoint check then uses its defaults.
      NETWORK_STATE_BUCKET: ${{ needs.network.outputs.state_bucket }}
      NETWORK_STATE_KEY: ${{ needs.network.outputs.state_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lambda-package
          path: dist
      - name: Install pinned Terraform
        env:
          TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSLo "$zip" https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          echo "$TERRAFORM_SHA256  $zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -oq "$zip" terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure the optional alert recipient
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          if [ -n "$ALERT_EMAIL" ]; then
            echo "TF_VAR_alert_email=$ALERT_EMAIL" >> "$GITHUB_ENV"
          fi
      - name: Confirm the private migration path
        run: bash scripts/check_network_endpoint.sh
      - name: Create the Terraform state bucket if absent
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if probe="$(aws s3api head-bucket --bucket "$STATE_BUCKET" --expected-bucket-owner "$account" 2>&1)"; then
            echo "State bucket already exists."
          elif grep -q '(404)' <<<"$probe"; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api wait bucket-exists --bucket "$STATE_BUCKET"
          else
            echo "$probe"
            exit 1
          fi
      - name: Apply package storage
        run: |
          set -euo pipefail
          terraform -chdir=infra/bootstrap init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=bootstrap/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform -chdir=infra/bootstrap apply -input=false -auto-approve -lock-timeout=10m
      - name: Upload the immutable Lambda package
        id: package
        run: |
          set -euo pipefail
          bucket="$(terraform -chdir=infra/bootstrap output -raw package_bucket)"
          key="releases/$GITHUB_SHA/data-processing-service-lambda.zip"
          file=dist/data-processing-service-lambda.zip
          test -s "$file"
          digest="$(openssl dgst -sha256 -binary "$file" | base64 | tr -d '\n')"
          if remote="$(aws s3api head-object --bucket "$bucket" --key "$key" --checksum-mode ENABLED --query ChecksumSHA256 --output text 2>/dev/null)"; then
            test "$remote" = "$digest" || { echo '::error::Package key already holds different bytes'; exit 1; }
          else
            aws s3api put-object --bucket "$bucket" --key "$key" --body "$file" --checksum-sha256 "$digest" --if-none-match '*' >/dev/null
          fi
          echo "package_bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Apply persistent storage
        run: |
          set -euo pipefail
          terraform -chdir=infra/persistent init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=persistent/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform -chdir=infra/persistent apply -input=false -auto-approve -lock-timeout=10m
      - name: Apply application without exposing an unmigrated first release
        env:
          TF_VAR_package_bucket: ${{ steps.package.outputs.package_bucket }}
          TF_VAR_package_sha256: ${{ steps.package.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/application init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=application/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          triggers=false
          if probe="$(aws s3api head-object --bucket "$STATE_BUCKET" --key application/terraform.tfstate 2>&1)"; then
            terraform -chdir=infra/application state list > "$RUNNER_TEMP/application-state.txt"
            if grep -Eq '^aws_apigatewayv2_route.read\[|^aws_apigatewayv2_route.submission(\[0\])?$|^aws_lambda_event_source_mapping.worker(\[0\])?$|^aws_cloudwatch_event_target.schedule\[' "$RUNNER_TEMP/application-state.txt"; then
              triggers=true
            fi
          elif grep -q '(404)' <<<"$probe"; then
            echo 'No application state; first release starts without traffic triggers.'
          else
            echo "::error::Unable to inspect application state: $probe"
            exit 1
          fi
          export TF_VAR_enable_live_triggers="$triggers"
          echo "Existing live triggers: $triggers"
          terraform -chdir=infra/application apply -input=false -auto-approve -lock-timeout=10m
          terraform -chdir=infra/application output -json > "$RUNNER_TEMP/application-outputs.json"
      - name: Migrate the database and promote live aliases
        run: bash scripts/migrate_and_promote.sh "$RUNNER_TEMP/application-outputs.json"
      - name: Activate API, queue, and schedules
        env:
          TF_VAR_package_bucket: ${{ steps.package.outputs.package_bucket }}
          TF_VAR_package_sha256: ${{ steps.package.outputs.package_sha256 }}
          TF_VAR_enable_live_triggers: 'true'
        run: terraform -chdir=infra/application apply -input=false -auto-approve -lock-timeout=10m
