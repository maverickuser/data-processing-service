name: Destroy application
# Explicitly removes only the disposable application Terraform root.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type destroy to remove the processing API, functions, and queues
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-processing-service-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STATE_BUCKET: data-processing-service-terraform-state
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
  TF_VAR_deployment_commit: ${{ github.sha }}
  # Required for configuration validation during a destroy plan; no package is uploaded.
  TF_VAR_package_sha256: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  destroy:
    name: Destroy disposable application resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    steps:
      - name: Require the exact confirmation and deployment inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != destroy ]; then echo '::error::Type destroy to confirm'; exit 1; fi
          if [ -z "$AWS_ROLE_TO_ASSUME" ] || [ -z "$TF_VAR_hosted_zone_id" ]; then
            echo '::error::AWS_ROLE_TO_ASSUME and HOSTED_ZONE_ID must be configured'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Terraform
        env:
          TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/terraform.zip"
          curl -fsSLo "$zip" https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          echo "$TERRAFORM_SHA256  $zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -oq "$zip" terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan and destroy the application root only
        run: |
          set -euo pipefail
          terraform -chdir=infra/application init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=application/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform -chdir=infra/application plan -destroy -input=false -lock-timeout=10m -out=application-destroy.tfplan
          terraform -chdir=infra/application apply -input=false -lock-timeout=10m application-destroy.tfplan
